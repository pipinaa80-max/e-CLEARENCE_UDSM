<header class="login-header">
  <div class="header-content">
    <!-- FIX: Changed from /public/ to /public/ -->
    <a routerLink="/"><img [src]="branding.logoUrl" alt="Institutional Logo" class="header-logo" /></a>
    <h2>{{ branding.shortName }} MIS</h2>
  </div>
</header>

<section class="login-page">
  <div class="login-card">
    <div class="brand-panel">
      <!-- FIX: Changed from /public/ to /public/ -->
      <img [src]="branding.logoUrl" alt="Institutional Logo" class="brand-badge" />
      <h1>{{ branding.universityName }}</h1>
      <p>Secure access for students, staff, and administrators.</p>
    </div>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="submit()">
      <label class="field" for="identifier">
        <span>Email / Registration Number</span>
        <div class="field-input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8" />
            <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <input
                id="identifier"
                type="text"
                formControlName="identifier"
                placeholder="Enter your email or registration number"
                required
          />
        </div>
      </label>

      <div class="field">
        <label for="password">Password</label>
        <div class="field-input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <rect x="4" y="10" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.8" />
            <path d="M8 10V7a4 4 0 1 1 8 0v3M12 14v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="Enter your password"
                required
          />
          <button
            class="password-toggle"
            type="button"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            [title]="showPassword ? 'Hide password' : 'Show password'"
          >
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
              <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.8" />
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
              <path d="m3 3 18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c6.1 0 9.5 6 9.5 6a15 15 0 0 1-3 3.5M6.2 6.3C3.8 8 2.5 12 2.5 12s3.4 6 9.5 6c1 0 1.9-.2 2.8-.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading">Signing In...</span>
      </button>

      <div class="helper-row">
        <!-- FIX: Changed routerLink from /login to /forgot-password -->
        <a routerLink="/forgot-password">Forgot Password?</a>
        <a routerLink="/signup-options">Create Account</a>
      </div>
    </form>
  </div>
</section>
