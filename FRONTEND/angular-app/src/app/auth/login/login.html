<header class="login-header">
  <div class="header-content">
    <!-- FIX: Changed from /public/ to /public/ -->
    <a routerLink="/"><img [src]="branding.logoUrl" alt="Institutional Logo" class="header-logo" /></a>
    <h2>University of Dar es Salaam</h2>
  </div>
</header>

<section class="login-page">
  <div class="login-card">
    <div class="brand-panel">
      <!-- FIX: Changed from /public/ to /public/ -->
      <img [src]="branding.logoUrl" alt="Institutional Logo" class="brand-badge" />
      <h1>{{ branding.universityName }}</h1>
      <p>Secure access for students, staff, and administrators.</p>
    </div>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="submit()">
      <!-- Security Honeypot: Invisible to human users, traps automated bots -->
      <div style="position: absolute; left: -9999px; opacity: 0; pointer-events: none;" aria-hidden="true">
        <input type="text" formControlName="honeypotTrap" tabindex="-1" autocomplete="off" aria-label="Security check" />
      </div>

      <label class="field" for="identifier">
        <span>Email / Registration Number</span>
        <div class="field-input-wrap" [class.has-value]="isIdentifierFilled">
          <i class="bi bi-envelope-fill field-icon" aria-hidden="true"></i>
          <input
            id="identifier"
            type="text"
            formControlName="identifier"
            placeholder="Enter your email or registration number"
            autocomplete="username"
            inputmode="email"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="next"
            (keydown.enter)="onIdentifierEnter($event)"
            required
          />
          <i class="bi bi-check-circle-fill field-valid-icon" *ngIf="isIdentifierFilled" title="Identifier entered" aria-hidden="true"></i>
        </div>
      </label>

      <div class="field">
        <label for="password">Password</label>
        <div class="field-input-wrap" [class.has-value]="isPasswordFilled">
          <i class="bi bi-lock-fill field-icon" aria-hidden="true"></i>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            enterkeyhint="go"
            (keydown.enter)="onPasswordEnter($event)"
            required
          />
          <i class="bi bi-check-circle-fill field-valid-icon password-valid-icon" *ngIf="isPasswordFilled && loginForm.controls.password.valid" title="Valid password entered" aria-hidden="true"></i>
          <button
            class="password-toggle"
            type="button"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            [title]="showPassword ? 'Hide password' : 'Show password'"
          >
            <i *ngIf="!showPassword" class="bi bi-eye" aria-hidden="true"></i>
            <i *ngIf="showPassword" class="bi bi-eye-slash" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn-submit"
        [class.btn-ready]="isFormReady"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">
          Sign In
          <i class="bi bi-arrow-right-short btn-arrow" aria-hidden="true"></i>
        </span>
        <span *ngIf="isLoading" class="btn-loading">
          <span class="spinner-border" role="status" aria-hidden="true"></span>
          Signing In...
        </span>
      </button>

      <div class="helper-row">
        <!-- FIX: Changed routerLink from /login to /forgot-password -->
        <a routerLink="/forgot-password">Forgot Password?</a>
      </div>
    </form>
  </div>
</section>
