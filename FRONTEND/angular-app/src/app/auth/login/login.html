<header class="login-header">
  <div class="login-header-inner">
    <a routerLink="/" class="header-brand-link" aria-label="University of Dar es Salaam — UDSM e-Clearance System (MIS)">
      <span class="header-logo-frame">
        <img [src]="branding.logoUrl || '/udsm-logo.png'" (error)="onLogoError($event)" alt="University of Dar es Salaam Crest" class="header-logo" />
      </span>
      <span class="header-brand-text">
        <strong class="header-university-name">University of Dar es Salaam</strong>
        <small class="header-system-name">UDSM e-Clearance System (MIS)</small>
      </span>
    </a>

    <a routerLink="/" class="header-home-link">
      <i class="bi bi-house-door-fill" aria-hidden="true"></i>
      <span>Home</span>
    </a>
  </div>
</header>

<section class="login-page">
  <div class="login-card">
    <form class="login-form" method="post" [formGroup]="loginForm" (ngSubmit)="submit()" aria-labelledby="login-heading">
      <h1 id="login-heading" class="login-title">Sign In</h1>

      <!-- Security Honeypot: Invisible to human users, traps automated bots -->
      <div class="honeypot-field" aria-hidden="true">
        <input type="text" name="website" formControlName="honeypotTrap" tabindex="-1" autocomplete="off" />
      </div>

      <div class="field">
        <label for="identifier">Email / Registration Number</label>
        <div class="field-input-wrap" [class.has-value]="isIdentifierFilled">
          <i class="bi bi-envelope-fill field-icon" aria-hidden="true"></i>
          <input
            id="identifier"
            name="identifier"
            type="text"
            formControlName="identifier"
            autocomplete="username"
            inputmode="email"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="next"
            (keydown.enter)="onIdentifierEnter($event)"
            required
          />
          <i class="bi bi-check-circle-fill field-valid-icon" *ngIf="isIdentifierFilled" title="Identifier entered" aria-hidden="true"></i>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="field-input-wrap" [class.has-value]="isPasswordFilled">
          <i class="bi bi-lock-fill field-icon" aria-hidden="true"></i>
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            enterkeyhint="done"
            (keydown.enter)="onPasswordEnter($event)"
            required
          />
          <i class="bi bi-check-circle-fill field-valid-icon password-valid-icon" *ngIf="isPasswordFilled && loginForm.controls.password.valid" title="Valid password entered" aria-hidden="true"></i>
          <button
            class="password-toggle"
            type="button"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            [title]="showPassword ? 'Hide password' : 'Show password'"
          >
            <i *ngIf="!showPassword" class="bi bi-eye" aria-hidden="true"></i>
            <i *ngIf="showPassword" class="bi bi-eye-slash" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn-submit"
        [class.btn-ready]="isFormReady"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">
          Sign In
          <i class="bi bi-arrow-right-short btn-arrow" aria-hidden="true"></i>
        </span>
        <span *ngIf="isLoading" class="btn-loading">
          <span class="spinner-border" role="status" aria-hidden="true"></span>
          Signing In...
        </span>
      </button>

      <div class="helper-row">
        <a routerLink="/forgot-password">Forgot Password?</a>
      </div>
    </form>
  </div>
</section>
