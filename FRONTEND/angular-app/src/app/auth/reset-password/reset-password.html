<div class="reset-password-page">
  <div class="card">
    <div class="header">
      <img src="/public/udsm-logo.png" alt="UDSM" class="logo" />
      <h1>Set New Password</h1>
      <p>Please enter your new password below.</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="submit()" *ngIf="!message && token">
      <div class="form-field">
        <label for="password">New Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Min 8 characters"
          required
        />
      </div>

      <div class="form-field">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Repeat new password"
          required
        />
      </div>

      <button type="submit" [disabled]="resetForm.invalid || isLoading">
        <span *ngIf="!isLoading">Reset Password</span>
        <span *ngIf="isLoading">Resetting...</span>
      </button>
    </form>

    <div class="success-message" *ngIf="message">
      <div class="icon">✅</div>
      <p>{{ message }}</p>
      <p class="redirect-info">Redirecting to login...</p>
      <a routerLink="/login" class="back-link">Go to Login Now</a>
    </div>

  </div>
</div>
