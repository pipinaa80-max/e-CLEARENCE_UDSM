<div class="reset-password-page">
  <div class="card">
    <div class="header">
      <img src="/public/udsm-logo.png" alt="UDSM" class="logo" />
      <h1>Set New Password</h1>
      <p>Please enter your new password below.</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="submit()" *ngIf="!message && token">
      <div class="form-field">
        <label for="password">New Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Min 8 characters"
          required
        />
        <div class="error" *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.invalid">
          Password must be at least 8 characters long.
        </div>
      </div>

      <div class="form-field">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Repeat new password"
          required
        />
      </div>

      <button type="submit" [disabled]="resetForm.invalid || isLoading">
        <span *ngIf="!isLoading">Reset Password</span>
        <span *ngIf="isLoading">Resetting...</span>
      </button>

      <p class="error-alert" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <div class="error-section" *ngIf="!token && errorMessage">
      <p class="error-alert">{{ errorMessage }}</p>
      <a routerLink="/forgot-password" class="primary-link">Request New Link</a>
    </div>

    <div class="success-message" *ngIf="message">
      <div class="icon">✅</div>
      <p>{{ message }}</p>
      <p class="redirect-info">Redirecting to login...</p>
      <a routerLink="/login" class="back-link">Go to Login Now</a>
    </div>

  </div>
</div>
