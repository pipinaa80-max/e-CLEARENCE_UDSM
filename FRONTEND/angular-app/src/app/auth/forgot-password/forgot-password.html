<div class="forgot-password-page">
  <div class="card">
    <div class="header">
      <img src="/public/udsm-logo.png" alt="UDSM" class="logo" />
      <h1>Forgot Password</h1>
      <p>Enter your email address to receive a password reset link.</p>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()" *ngIf="!message">
      <div class="form-field">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="e.g. name@example.com"
          required
        />
        <div class="error" *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid">
          Please enter a valid email address.
        </div>
      </div>

      <button type="submit" [disabled]="forgotPasswordForm.invalid || isLoading">
        <span *ngIf="!isLoading">Send Reset Link</span>
        <span *ngIf="isLoading">Sending...</span>
      </button>

      <p class="error-alert" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <div class="success-message" *ngIf="message">
      <div class="icon">✉️</div>
      <p>{{ message }}</p>
      <a routerLink="/login" class="back-link">Return to Login</a>
    </div>

    <div class="footer-links" *ngIf="!message">
      <a routerLink="/login">Back to Login</a>
    </div>
  </div>
</div>
