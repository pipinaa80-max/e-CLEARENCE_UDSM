<section class="register-page"><div class="register-card"><div class="card-header"><img src="/udsm-logo.jpg" alt="UDSM Logo" class="brand-badge" /><h1>University of Dar es Salaam</h1><p>Student registration — academic details are selected during clearance application.</p></div><form class="register-form" [formGroup]="registerForm" (ngSubmit)="submit()"><div class="form-grid"><label class="field"><span>First Name</span><input formControlName="firstName" placeholder="First Name" /></label><label class="field"><span>Middle Name</span><input formControlName="middleName" placeholder="Middle Name" /></label><label class="field full-width"><span>Last Name</span><input formControlName="lastName" placeholder="Last Name" /></label><label class="field full-width"><span>Registration Number</span><input formControlName="registrationNumber" placeholder="Registration Number" /></label><label class="field full-width"><span>Email</span><input type="email" formControlName="email" placeholder="Email" /></label><label class="field full-width"><span>Mobile Number</span><input type="tel" formControlName="phone" placeholder="Mobile Number" /></label><label class="field full-width"><span>Create Password</span><input type="password" formControlName="password" placeholder="Create Password" /></label><label class="field full-width"><span>Repeat Password</span><input type="password" formControlName="confirmPassword" placeholder="Repeat Password" /></label></div><label class="checkbox-row"><input type="checkbox" formControlName="acceptTerms" /><span>I accept terms of service</span></label><p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p><p class="success-message" *ngIf="successMessage">{{ successMessage }}</p><button type="submit">Register</button><div class="helper-row"><span>Have an account?</span><a routerLink="/login">Login</a></div></form></div></section>
