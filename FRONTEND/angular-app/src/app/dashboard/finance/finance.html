<section class="dashboard-shell" [class.sidebar-open]="sidebarOpen">
  <button type="button" class="sidebar-toggle" aria-label="Toggle navigation" (click)="toggleSidebar()">
    ☰
  </button>

  <aside class="sidebar">
    <div class="brand">Finance</div>
    <nav>
      <a routerLink="/dashboard/finance">Overview</a>
      <a routerLink="/dashboard/finance">Pending</a>
      <a routerLink="/dashboard/finance">Financially Cleared</a>
      <button type="button" class="logout-link" (click)="logout()">Log out</button>
    </nav>
  </aside>

  <main class="content-panel">
    <header class="topbar">
      <div>
        <h2>Finance Dashboard</h2>
        <p>Review financial clearance records</p>
      </div>
    </header>

    <div class="stats-grid">
      <article class="stat-card"><span>Pending</span><strong>18</strong></article>
      <article class="stat-card success"><span>Cleared</span><strong>64</strong></article>
      <article class="stat-card warning"><span>Outstanding</span><strong>11</strong></article>
      <article class="stat-card danger"><span>Rejected</span><strong>2</strong></article>
    </div>
  </main>
</section>
