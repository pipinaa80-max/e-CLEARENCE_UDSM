<section class="dashboard-shell" [class.sidebar-open]="sidebarOpen">
  <button
    type="button"
    class="sidebar-toggle"
    aria-label="Toggle navigation"
    (click)="toggleSidebar()"
  >
    ☰
  </button>

  <aside class="sidebar">
    <div class="brand">
      <img src="/udsm-logo.png" alt="Institutional Logo" />
      <div>
        <strong>ACADEMIC STAFF</strong>
        <small>Clearance Workspace</small>
      </div>
    </div>
    <nav>
      <a routerLink="/dashboard/academic">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5v-3zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5v-3zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3zm8 0A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5v-3z"/></svg>
        <span>Overview</span>
      </a>
      <a routerLink="/dashboard/academic">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M14 14V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM4 3h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M5 6h6v1H5V6zm0 3h6v1H5V9zm0 3h4v1H5v-1z"/></svg>
        <span>Waiting</span>
      </a>
      <a routerLink="/dashboard/academic">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L7.001 11a.75.75 0 0 0 1.042-.018l4.004-4.5a.75.75 0 0 0-.017-1.042z"/></svg>
        <span>Approved</span>
      </a>
    </nav>
  </aside>

  <main class="content-panel">
    <app-dashboard-header
      title="Academic Staff Dashboard"
      subtitle="Academic staff student grade and project clearance"
      [user]="currentUser"
      [showToggle]="true"
      (toggleSidebar)="toggleSidebar()"
    >
    </app-dashboard-header>

    <div class="stats-grid">
      <article class="stat-card">
        <span>Pending</span><strong>13</strong>
      </article>
      <article class="stat-card success">
        <span>Approved</span><strong>50</strong>
      </article>
      <article class="stat-card danger">
        <span>Rejected</span><strong>4</strong>
      </article>
    </div>
  </main>
</section>
