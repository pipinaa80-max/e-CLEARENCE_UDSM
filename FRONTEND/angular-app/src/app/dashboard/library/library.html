<section class="dashboard-shell" [class.sidebar-open]="sidebarOpen">
  <button type="button" class="sidebar-toggle" aria-label="Toggle navigation" (click)="toggleSidebar()">
    ☰
  </button>

  <aside class="sidebar">
    <div class="brand">Library</div>
    <nav>
      <a routerLink="/dashboard/library">Overview</a>
      <a routerLink="/dashboard/library">Pending</a>
      <a routerLink="/dashboard/library">Approved</a>
      <button type="button" class="logout-link" (click)="logout()">Log out</button>
    </nav>
  </aside>

  <main class="content-panel">
    <header class="topbar">
      <div>
        <h2>Library Dashboard</h2>
        <p>Manage student library clearance requests</p>
      </div>
    </header>

    <div class="stats-grid">
      <article class="stat-card"><span>Total Pending</span><strong>12</strong></article>
      <article class="stat-card success"><span>Approved</span><strong>48</strong></article>
      <article class="stat-card danger"><span>Rejected</span><strong>3</strong></article>
      <article class="stat-card"><span>Total Students</span><strong>186</strong></article>
    </div>

    <section class="table-panel">
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Registration</th>
            <th>Programme</th>
            <th>Request Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Demo Student</td>
            <td>DEMO-001</td>
            <td>Computer Science</td>
            <td>2026-08-01</td>
            <td><span class="status pending">Pending</span></td>
            <td><button>Approve</button></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</section>
