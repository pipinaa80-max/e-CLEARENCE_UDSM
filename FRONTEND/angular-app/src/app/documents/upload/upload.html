<section class="student-portal-shell" [class.sidebar-open]="sidebarOpen">
  <app-student-sidebar [open]="sidebarOpen" (close)="closeSidebar()"></app-student-sidebar>

  <main class="content-panel">
    <app-dashboard-header
      title="Upload Document"
      subtitle="Upload your required academic and birth certificates (PDF, JPG, or PNG)."
      [user]="currentUser"
      [showToggle]="true"
      (toggleSidebar)="toggleSidebar()"
    >
      <div header-actions>
        <a routerLink="/documents" class="documents-nav-link">View Uploaded Documents</a>
      </div>
    </app-dashboard-header>

    <div class="upload-card">
      <header>
        <h2>Document Checklist</h2>
        <p>Select a category below and attach a clear scan or photo of your certificate.</p>
      </header>

      <div class="checklist">
        <div *ngFor="let category of categories" [class.complete]="!missingCategories.includes(category)">
          <span>
            <i *ngIf="!missingCategories.includes(category)" class="bi bi-check-circle-fill"></i>
            <i *ngIf="missingCategories.includes(category)" class="bi bi-circle"></i>
          </span>
          <div>
            <strong>{{ category }}</strong>
            <small>{{ !missingCategories.includes(category) ? 'Uploaded' : 'Pending upload' }}</small>
          </div>
        </div>
      </div>

      <form [formGroup]="uploadForm" (ngSubmit)="submit()">
        <label class="field">
          <span>Document Category</span>
          <select formControlName="category">
            <option *ngFor="let category of missingCategories" [value]="category">{{ category }}</option>
            <option *ngIf="!missingCategories.length" value="" disabled>All listed categories uploaded</option>
          </select>
        </label>

        <label class="field file-field">
          <span>Choose File (PDF, JPG, PNG)</span>
          <input type="file" accept=".pdf,.jpg,.jpeg,.png" (change)="onFileSelected($event)" />
          <small *ngIf="selectedFile" style="color: #0369a1; font-weight: 600;">Selected: {{ selectedFile.name }}</small>
        </label>

        <div class="upload-actions">
          <button type="submit" [disabled]="isSubmitting || !missingCategories.length || !selectedFile">
            {{ isSubmitting ? 'Uploading...' : 'Upload Document' }}
          </button>
          <a routerLink="/documents" class="documents-link">View Uploaded Documents</a>
        </div>
      </form>
    </div>
  </main>
</section>
