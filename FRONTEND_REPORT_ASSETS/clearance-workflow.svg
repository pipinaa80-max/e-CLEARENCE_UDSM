<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730">
  <rect width="1200" height="730" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#123b63">E-Clearance Frontend Workflow</text>
  <g font-family="Arial, sans-serif" font-size="17" text-anchor="middle">
    <rect x="440" y="70" width="320" height="54" rx="12" fill="#0b5d8b"/><text x="600" y="104" fill="white">Open Angular application</text>
    <path d="M600 124 V154" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="440" y="155" width="320" height="54" rx="12" fill="#0b5d8b"/><text x="600" y="189" fill="white">Register or sign in</text>
    <path d="M600 209 V239" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="440" y="240" width="320" height="54" rx="12" fill="#0b5d8b"/><text x="600" y="274" fill="white">Identify user role</text>
    <path d="M440 267 H220" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <path d="M760 267 H980" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="40" y="330" width="360" height="110" rx="12" fill="#e9b949"/><text x="220" y="365" fill="#172554">Student frontend</text><text x="220" y="393" fill="#172554">Profile, clearance form,</text><text x="220" y="419" fill="#172554">documents and submission</text>
    <rect x="800" y="330" width="360" height="110" rx="12" fill="#e9b949"/><text x="980" y="365" fill="#172554">Staff frontend</text><text x="980" y="393" fill="#172554">Role dashboard, review,</text><text x="980" y="419" fill="#172554">approval and comments</text>
    <path d="M220 440 V505 H600" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <path d="M980 440 V505 H600" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="440" y="505" width="320" height="64" rx="12" fill="#198754"/><text x="600" y="544" fill="white">Backend validates and stores result</text>
    <path d="M600 569 V600" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="350" y="601" width="500" height="64" rx="12" fill="#198754"/><text x="600" y="640" fill="white">Status, notifications, transcript or convocation service</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
