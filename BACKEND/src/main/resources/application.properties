spring.application.name=BACKEND

# ============================================
# APPLICATION NAME
# ============================================
# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
server.servlet.context-path=/api/v1
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/css,text/plain
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.tomcat.connection-timeout=20000

# ============================================
# DATABASE CONFIGURATION
# ============================================
# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/clearance_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=public

# ============================================
# THYMELEAF CONFIGURATION
# ============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

# ============================================
# FLYWAY MIGRATION (Optional - For Production)
# ============================================
# spring.flyway.enabled=true
# spring.flyway.baseline-on-migrate=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.clean-disabled=true

# ============================================
# MULTIPART FILE UPLOAD
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ============================================
# JWT (JSON WEB TOKEN) CONFIGURATION
# ============================================
jwt.secret=smartclearance-udsm-super-secret-key-2024-min-256-bits-long-secure-key
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================
# EMAIL CONFIGURATION
# ============================================
# NOTE: Gmail has a daily limit (approx 500 emails).
# For production, please use a transactional service like SendGrid, Mailgun, or AWS SES.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=charlesnestory432@gmail.com
spring.mail.password=jlxs wmfe bbez rbuz

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com  # ✅ ADD THIS
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 

# For debugging
spring.mail.properties.mail.debug=true


# Optional: Configure email batch size
app.email.batch-size=50
app.email.delay-between-batches=1000


# ============================================
# JACKSON CONFIGURATION
# ============================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=Africa/Dar_es_Salaam
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.com.UDSM.BACKEND=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/smartclearance.log
logging.file.max-size=10MB
logging.file.max-history=30

# ============================================
# APPLICATION SPECIFIC
# ============================================
app.name=SmartClearance UDSM
app.version=1.0.0
app.base-url=https://smartclearance.udsm.ac.tz
app.frontend-url=http://localhost:4200

# ============================================
# ARIS3 INTEGRATION
# ============================================
app.aris3.base-url=https://aris3.udsm.ac.tz/api
app.aris3.timeout=5000
app.aris3.api-key=your_aris3_api_key_here

# ============================================
# CLEARANCE CERTIFICATE
# ============================================
app.clearance.certificate.expiry-days=30

# ============================================
# STORAGE CONFIGURATION
# ============================================
app.storage.upload-dir=./uploads
app.storage.temp-dir=./temp

# ============================================
# BACKUP CONFIGURATION
# ============================================
app.backup.enabled=true
app.backup.schedule=0 0 2 * * *
app.backup.location=./backups

# ============================================
# CORS CONFIGURATION
# ============================================
# Allowed origins (comma separated)
cors.allowed-origins=http://localhost:4200,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ============================================
# SPRING SECURITY
# ============================================
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMINISTRATOR

# ============================================
# ACTUATOR / HEALTH CHECK
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ============================================
# SPRINGDOC / SWAGGER
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=true



spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# fly wheel

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

