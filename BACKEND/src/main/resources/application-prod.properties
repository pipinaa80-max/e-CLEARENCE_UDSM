# ==========================================
# PRODUCTION APPLICATION PROFILE (prod)
# ==========================================
spring.application.name=BACKEND

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080
server.servlet.context-path=/api/v1
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/css,text/plain
server.compression.min-response-size=1024
server.forward-headers-strategy=framework

# ==========================================
# NEON POSTGRESQL / PRODUCTION DATASOURCE
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-lively-poetry-bep9glo2-pooler.c-9.us-east-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_wXGL0NdO5tVl}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon Connection Pool (Optimized for Serverless / Connection Pooling)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==========================================
# FLYWAY MIGRATIONS
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ==========================================
# EMAIL CONFIGURATION
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:codexcoding196@gmail.com}
spring.mail.password=${MAIL_PASSWORD:123456789}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

app.mail.from=${MAIL_FROM:codexcoding196@gmail.com}

# ==========================================
# JWT (JSON WEB TOKEN)
# ==========================================
jwt.secret=${JWT_SECRET:smartclearance-udsm-super-secret-key-2024-min-256-bits-long-secure-key}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Control-plane superuser bootstrap
control-plane.superuser.email=${SUPERUSER_EMAIL:superuser@admin.local}
control-plane.superuser.password=${SUPERUSER_PASSWORD:ChangeMeImmediately!2026}

# ==========================================
# APPLICATION URLS & ARIS3
# ==========================================
app.name=SmartClearance UDSM
app.version=1.0.0
app.base-url=${APP_BASE_URL:https://smartclearance.udsm.ac.tz}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
app.aris3.base-url=${ARIS3_BASE_URL:https://aris3.udsm.ac.tz/api}
app.aris3.timeout=${ARIS3_TIMEOUT:5000}
app.aris3.api-key=${ARIS3_API_KEY:your_aris3_api_key_here}
app.clearance.certificate.expiry-days=30

# ==========================================
# CORS CONFIGURATION
# ==========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,https://smartclearance.udsm.ac.tz}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ==========================================
# FILE UPLOAD & STORAGE
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

app.storage.type=${STORAGE_TYPE:local}
app.storage.upload-dir=${UPLOAD_DIR:./uploads}
app.storage.temp-dir=${TEMP_DIR:/tmp/clearance}
app.storage.s3.bucket=${S3_BUCKET:clearance-documents}
app.storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}

# ==========================================
# CACHE CONFIGURATION
# ==========================================
spring.cache.type=${CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ==========================================
# LOGGING
# ==========================================
logging.level.com.UDSM.BACKEND=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=${LOG_FILE:/tmp/smartclearance.log}
logging.file.max-size=10MB
logging.file.max-history=30

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# ==========================================
# ACTUATOR & HEALTH MONITORING
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false
